[build-system]
requires = ["hatchling>=1.5.0", "jupyterlab>=4.0.0,<5", "hatch-nodejs-version>=0.3.2"]
build-backend = "hatchling.build"

[project]
name = "ggblab"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "websockets",
    "ipylab",
    "polars",
    "aiofiles",
    "xmlschema",
    "networkx",
    "numpy",
    "sympy",
    "ipykernel",
    "pyperclip",
    "psutil",
]
dynamic = ["version", "description", "authors", "urls", "keywords"]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls", "keywords"]

[tool.hatch.build.targets.sdist]
exclude = [".github", "binder"]

[tool.hatch.build.targets.wheel.shared-data]
# Labextension packaging disabled for editable installs to avoid copying
# built JupyterLab assets into the environment during `pip install -e .`.
# If you need prebuilt labextension packaging for releases, restore these
# mappings or use a CI job that builds and publishes the labextension.

[tool.hatch.build.hooks.version]
path = "ggblab/_version.py"

# Jupyter builder hooks disabled for editable installs to avoid running
# npm builds or copying labextension assets during `pip install -e .`.
# For release packaging, re-enable appropriate hooks or build the
# labextension in CI and include artifacts in release wheels.


[tool.hatch.build]
packages = ["ggblab", "ggblab_extra", "ggblab_core", "ggblab_core2", "comm_bridge"]

[tool.jupyter-releaser.options]
version_cmd = "hatch version"

[tool.jupyter-releaser.hooks]
before-build-npm = [
    "python -m pip install 'jupyterlab>=4.0.0,<5'",
    "jlpm",
    "jlpm build:prod"
]
before-build-python = ["jlpm clean:all"]

[tool.check-wheel-contents]
ignore = ["W002"]
