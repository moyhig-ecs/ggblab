# Publish version 2, after the CI workflow passes at the tagged commit. A tag v2.0.0rc1 publishes to PyPI; "Run workflow" publishes to TestPyPI (or PyPI, by choice).
# A workflow runs from the files of the commit the tag points to, so tags on the version 1 branch do not start this one.
name: publish

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      target:
        description: "where to publish"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  # 2.0.0rc2 (2026-10-07) reached PyPI while CI was red (the 3.11 job and the Julia job): this workflow built and published
  # without waiting for the tests. Now the tests, the Julia package and the build of ci.yml run first, at the tagged commit,
  # and nothing is published unless all of them pass.
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
          python tests/check_wheel.py dist/*.whl
      - name: The tag is the version in pyproject.toml
        if: github.event_name == 'push'
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, version $VERSION"; exit 1; }
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true
      - name: Publish to PyPI
        if: github.event_name == 'push' || inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
