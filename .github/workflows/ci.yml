# Version 2 (branch v2). Tests run in the source tree: they read fixtures by paths relative to the repository.
name: ci

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[extra,test]"
      - name: Test (the runner has julia but not the Julia packages, so the four tests that start Julia are skipped)
        run: python -m pytest -q tests

  julia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[extra,test]"
          julia -e 'using Pkg; Pkg.add(["JSON", "PythonCall"])'
      - name: Test the Julia host and the string macro
        run: python -m pytest -q tests/test_julia_host_parity.py tests/test_julia_macro_parity.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: The wheel carries the four kinds of data
        run: python tests/check_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
