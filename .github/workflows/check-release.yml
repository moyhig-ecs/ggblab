name: Check Release
# 2026-10-06: version 1 is frozen on this branch; this workflow no longer runs on push or pull_request
# (its failures predate the freeze: see the v2 branch for the live CI). Run it by hand from the Actions tab if needed.
on:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1
      - name: Check Release
        uses: jupyter-server/jupyter_releaser/.github/actions/check-release@v2
        with:

          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Distributions
        uses: actions/upload-artifact@v4
        with:
          name: ggblab-releaser-dist-${{ github.run_number }}
          path: .jupyter_releaser_checkout/dist
