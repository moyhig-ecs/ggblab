name: Build and deploy blog to gh-pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Install Ruby dependencies
        working-directory: blog
        run: |
          gem install bundler
          bundle config set --local path '.bundle'
          bundle install

      - name: Build Jekyll site from blog/
        working-directory: blog
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --source . --destination ../public

      - name: Copy Google verification files to site root
        run: |
          # Copy any google*.html verification files from repo root to public/
          for f in google*.html; do
            if [ -e "$f" ]; then
              echo "Copying $f to public/"
              cp "$f" public/
            fi
          done

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: false
