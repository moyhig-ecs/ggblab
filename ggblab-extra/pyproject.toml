[build-system]
requires = ["hatchling>=1.5.0"]
build-backend = "hatchling.build"

[project]
name = "ggblab-extra"
version = "0.1.0"
description = "Extended functionality for ggblab: construction parsing, scene verification, and educational tools"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [
    { name = "Manabu Mizukami" },
]
keywords = [
    "GeoGebra",
    "geometry",
    "education",
    "jupyter",
    "parser",
    "networkx",
]
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "ggblab>=0.9.0",
    "polars>=0.20.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/moyhig-ecs/ggblab"
Documentation = "https://ggblab.readthedocs.io"

[tool.hatch.build.targets.wheel.shared-data]

[tool.hatch.build]
artifacts = []
