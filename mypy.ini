[mypy]
python_version = 3.10
ignore_missing_imports = True
warn_unused_configs = True
allow_redefinition = True
strict = False

# Treat these packages as third-party where type stubs may be missing
[mypy-ggblab.*]
ignore_missing_imports = True
[mypy-psutil.*]
ignore_missing_imports = True

[mypy-requests]
ignore_missing_imports = True
